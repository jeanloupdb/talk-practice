// Si les mots exacts ne sont pas retrouves (l'IA a reformule), toute la bulle porte la marque.
function marquer(youEl, items, cls){
  const texte = youEl.textContent, low = texte.toLowerCase();
  const zones = [];
  for (const it of items) {
    const o = String(it.original || "").trim().toLowerCase().replace(/[.?!,]+$/, "");
    if (!o) continue;
    let i = low.indexOf(o);
    while (i >= 0 && zones.some(z => i < z.fin && i + o.length > z.deb)) i = low.indexOf(o, i + 1);
    if (i >= 0) zones.push({deb:i, fin:i + o.length, items:[it]});
  }
  youEl.replaceChildren();
  const span = (txt, its) => { const sp = el("span", cls, txt); sp.tabIndex = 0; sp.onclick = e => { e.stopPropagation(); showFixPop(sp, its); }; sp.onkeydown = e => { if (e.key === "Enter") showFixPop(sp, its); }; return sp; };
  if (!zones.length) { youEl.append(span(texte, items)); return; }
  zones.sort((x, y) => x.deb - y.deb);
  let pos = 0;
  for (const z of zones) {
    if (z.deb > pos) youEl.append(document.createTextNode(texte.slice(pos, z.deb)));
    youEl.append(span(texte.slice(z.deb, z.fin), z.items)); pos = z.fin;
  }
  if (pos < texte.length) youEl.append(document.createTextNode(texte.slice(pos)));
}
// Rejoue un passage de l'enregistrement (avec une petite marge) ; tout l'enregistrement si la position manque.
const decodes = new WeakMap();
async function jouerPassage(blob, debut, fin){
  unlockAudio();
  let buf = decodes.get(blob);
  if (!buf) { buf = await actx.decodeAudioData(await blob.arrayBuffer()); decodes.set(blob, buf); }
  let d0 = 0, d1 = buf.duration;
  if (fin > debut && fin > 0 && debut < buf.duration) { d0 = Math.max(0, debut - 0.25); d1 = Math.min(buf.duration, fin + 0.3); }
  try { currentSrc?.stop(); } catch {}
  const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
  src.onended = () => { if (currentSrc === src) currentSrc = null; };
  currentSrc = src; src.start(0, d0, Math.max(0.35, d1 - d0));
}
function showFixPop(sp, items){
  hidePop(); selChunk = sp; sp.classList.add("sel");
  const box = el("div", "popfix");
  for (const c of items) {
    const row = el("div", "poprow"), t = el("div", "poptxt");
    t.append(el("b", null, c.corrected || c.better || ""));
    const why = c.explanation_fr || c.why_fr; if (why) t.append(el("small", null, why));
    const pl = el("button", "popplay"); pl.innerHTML = PLAY; pl.setAttribute("aria-label", "Écouter la bonne prononciation");
    pl.onclick = e => { e.stopPropagation(); unlockAudio(); speak(c.corrected || c.better, pl, null); };
    const blob = sp.closest(".you")?._rec;
    if (blob) {
      const moi = el("button", "popplay moi"); moi.innerHTML = ICO_MIC; moi.setAttribute("aria-label", "Réécouter ce que j’ai dit");
      moi.onclick = e => { e.stopPropagation(); stopSpeak(); jouerPassage(blob, c.debut, c.fin).catch(() => {}); };
      row.append(t, moi, pl);
    } else row.append(t, pl);
    box.append(row);
  }
  pop.classList.add("fixpop"); pop.replaceChildren(box); placerPop(sp);
}
function renderFix(d, youEl, onSkip){
  feed.querySelectorAll(".skip").forEach(b => b.remove());
  const list = Array.isArray(d.corrections) ? d.corrections.filter(c => c && c.corrected) : [];
  if (d.ok) {
    youEl.classList.add("juste");
    const c = d.conseil;
    if (c && c.better && c.better.trim() && journal.length - dernierConseil >= 6) { dernierConseil = journal.length; marquer(youEl, [c], "mieux"); }
    return youEl;
  }
  marquer(youEl, list, "faute");
  const skip = el("button", "skip", "Passer");
  skip.onclick = () => { skip.remove(); onSkip(); };
  youEl.after(skip);
  return youEl;
}

// Remet le flou (et cache la traduction) sur toutes les repliques affichees : on ecoute, on ne lit pas.
function reflouter(){
  feed.querySelectorAll(".claude").forEach(c => {
    c.querySelector(".msg")?.classList.add("hide"); c.classList.remove("trad");
    const libs = c.querySelectorAll(".tbtn span"); if (libs[0]) libs[0].textContent = "Afficher"; if (libs[1]) libs[1].textContent = "Traduire";
  });
  hidePop();
}
function renderClaude(chunks, replyFr, passe){
  if (!passe) {
    reflouter();
    feed.querySelectorAll(".claude").forEach(c => c.classList.add("old"));
    feed.querySelectorAll(".play.ready, .skip").forEach(b => b.classList.contains("skip") ? b.remove() : b.classList.remove("ready"));
  }
  const wrap = el("div","claude");
  const msg = el("p","msg hide");
  chunks.forEach((c, i) => {
    const s = el("span","chunk",c.en); s.tabIndex = 0;
    s.onclick = e => { e.stopPropagation(); showPop(s, c.en, c.fr); };
    s.onkeydown = e => { if (e.key === "Enter") showPop(s, c.en, c.fr); };
    msg.append(s); if (i < chunks.length - 1) msg.append(" ");
  });
  const text = chunks.map(c => c.en).join(" ");
  const ctrl = el("div","ctrl");
  const play = el("button","play ready"); setPlay(play, false);
  play.addEventListener("click", () => play.classList.remove("ready"), {once:true});
  const eye = el("button","tbtn"); eye.innerHTML = EYE; const eyeL = el("span",null,"Afficher"); eye.append(eyeL);
  const tr = el("button","tbtn"); tr.innerHTML = TRANS; const trL = el("span",null,"Traduire"); tr.append(trL);
  const fr = el("p","fr",replyFr || "");
  const reveal = (on = true) => { msg.classList.toggle("hide", !on); eyeL.textContent = on ? "Masquer" : "Afficher"; };
  play.onclick = () => { if (speakingBtn === play) stopSpeak(); else speak(text, play, reveal); };
  eye.onclick = () => { hidePop(); reveal(msg.classList.contains("hide")); };
  tr.onclick = () => { hidePop(); const on = !wrap.classList.contains("trad"); wrap.classList.toggle("trad", on); trL.textContent = on ? "Anglais" : "Traduire"; if (on) reveal(true); };
  ctrl.append(play, eye); if (replyFr) ctrl.append(tr);
  wrap.append(msg, fr, ctrl); if (!passe) feed.append(wrap);
  return {text, play, reveal, wrap};
}

// Phrases dites a voix haute quand il faut recommencer (courtes, en cache apres le 1er usage).
const RETRY_LINES = ["Not quite. Have another go!", "Almost! Try that again.", "Close! Fix those bits and say it again.", "Nearly there. One more time!"];
let essai = null;         // tentative en cours de correction : {prev, corrections, youEl, first}
let serie = 0;            // reponses justes du premier coup, d'affilee
let nbQuestions = 0;
function majCompteur(){}   // le compteur n'est plus affiche (la serie sert encore a la logique)
function setSerie(n){ const monte = n > serie; serie = n; majCompteur(monte); }
function compterQuestion(){ nbQuestions++; majCompteur(true); }

async function ask(learner, youEl, opts = {}){
  if (busy) return;
  busy = true; mic.disabled = true; hidePop();
  const dots = el("div","dots"); dots.append(el("i"), el("i"), el("i"));
  feed.append(dots); scrollDown(); setStatus("");
  const ctx = essai ? {...essai, force: !!opts.force} : (opts.force ? {prev:learner, corrections:[], force:true} : null);
  try {
    // Si l'IA repond dans un mauvais format, on retente une fois avant d'abandonner.
    let d, chunks;
    for (let n = 0; n < 2; n++) {
      try {
        d = await llm(buildPrompt(learner, ctx, !!opts.audio), SCHEMA, opts.audio || null);
        if (opts.audio) {
          const h = String(d?.heard || "").trim();
          if (!h) throw {code:"inaudible"};
          learner = h; youEl.textContent = h; youEl.classList.remove("pending");
          history.push({role:"user", content:h});
        }
        if (opts.force) d.ok = true;
        chunks = Array.isArray(d?.chunks) ? d.chunks.filter(c => c && typeof c.en === "string" && c.en.trim()) : [];
        if (d.ok && !chunks.length) throw {code:"shape", detail:JSON.stringify(d)};
        if (!d.ok && !(d.corrections || []).length) throw {code:"shape", detail:JSON.stringify(d)};
        break;
      } catch (e) {
        if (n === 1 || (e?.code !== "parse" && e?.code !== "shape")) throw e;
        if (opts.audio && learner) { history.pop(); learner = null; }
        console.warn("reponse IA inexploitable, nouvel essai", e);
      }
    }
    dots.remove();

    if (opts.audio && d.command === "pause" && mainsLibres) {
      // "pause" / "stop" dit a voix haute : on sort du mode mains libres
      history.pop(); youEl?.remove();
      mlStop("Mains libres en pause");
      speak("Okay, I'll pause here. Tap the headphones when you want to continue.", null, null);
      return;
    }
    if (learner && !d.ok) {
      // Erreur : on montre ce qui ne va pas, on le dit a l'oral, et on attend un nouvel essai.
      history.pop();                                   // la tentative ratee ne fait pas partie de la conversation
      if (mainsLibres && ++mlEchecs >= 3) {
        // mains libres : au 3e echec on passe a la suite, personne ne peut toucher "Passer"
        mlEchecs = 0; history.push({role:"user", content:learner});
        speak("Okay, let's move on.", null, null).then(() => ask(learner, youEl, {force:true}));
        return;
      }
      feed.querySelectorAll(".you.attempt").forEach(x => x.classList.add("tried"));
      youEl.classList.add("attempt");
      const first = essai ? essai.first : true;
      essai = {prev:learner, corrections:d.corrections, youEl, first:false};
      if (first) setSerie(0);
      journal.push({role:"user", content:learner, ok:false, tried:true, corrections:d.corrections || [], t:Date.now()}); sauverConv();
      if (first) { observer(d); suivreLecon(d, learner); }   // la 1re tentative compte dans le profil, pas les reprises
      renderFix(d, youEl, () => {
        // "Passer" : on garde la phrase telle quelle et la conversation continue.
        history.push({role:"user", content:learner});
        ask(learner, youEl, {force:true});
      });
      scrollDown();
      let dire = RETRY_LINES[Math.floor(Math.random() * RETRY_LINES.length)];
      // mains libres : on dit aussi les corrections, puisqu'on ne lit pas l'ecran
      if (mainsLibres) dire += " " + (d.corrections || []).slice(0, 2).filter(c => c.original && c.corrected && c.original !== c.corrected)
        .map(c => `Instead of "${c.original.replace(/[.?!]+$/, "")}", say "${c.corrected.replace(/[.?!]+$/, "")}".`).join(" ");
      speak(dire, null, null).then(() => mlApres());
      return;
    }
    mlEchecs = 0;

    if (learner) {
      if (!opts.force) renderFix(d, youEl);
      journal.push({role:"user", content:learner, ok:true, forced:!!opts.force, conseil:(!opts.force && d.conseil?.better) ? d.conseil : null, t:Date.now()});
      if (!essai && !opts.force) setSerie(serie + 1);
      const moi = [...history].reverse().find(h => h.role === "user");
      if (d.learner_asked && moi) { moi.asked = true; compterQuestion(); }
      observer(d); if (!opts.force) suivreLecon(d, learner);
      feed.querySelectorAll(".you.attempt").forEach(x => x.classList.add("tried"));
    }
    essai = null;
    const t = renderClaude(chunks, d.reply_fr);
    history.push({role:"assistant", content:t.text, chunks, fr:d.reply_fr || ""});
    journal.push({role:"assistant", content:t.text, chunks, fr:d.reply_fr || "", t:Date.now()});
    sauverConv();
    if (history.length > 20) history = history.slice(-20);
    lastHint = d.hint_en ? {en:d.hint_en, fr:d.hint_fr || ""} : null;
    if (learner && d.fait) ajouterFait(d.fait);
    scrollDown();
    // Phrase juste : "ding", puis la reponse est lue directement (l'audio se prepare pendant le ding).
    prechargerVoix(t.text);
    t.play.classList.remove("ready");
    (learner && !opts.force ? ding() : Promise.resolve()).then(() => speak(t.text, t.play, t.reveal)).then(() => mlApres());
  } catch (e) {
    dots.remove(); console.error(e);
    if (opts.audio) { if (learner) history.pop(); youEl?.remove(); }
    else if (learner && !opts.force) { history.pop(); youEl?.remove(); }
    setStatus({
      key:"Clé API refusée. Vérifie-la dans les réglages ⚙️.",
      model:"Modèle introuvable. Change le nom du modèle dans les réglages ⚙️.",
      rate:/per_day|PerDay|retry in \d+h/i.test(e?.detail || "") ? "Quota gratuit du jour épuisé, même sur le modèle de secours. Mets un autre modèle dans les réglages ⚙️, ou reviens demain." : "Limite gratuite par minute atteinte. Attends une minute et renvoie.",
      net:"Pas de réseau : la requête n’est pas partie. Vérifie ta connexion et renvoie.",
      busy:"Google est saturé, même avec le modèle de secours. Attends 30 secondes et renvoie.",
      inaudible:"Je n’ai pas compris ce que tu as dit. Rapproche-toi du micro et réessaie.",
      parse:"L’IA a répondu dans un format inattendu. Renvoie, en une phrase plus simple si possible.",
      shape:"L’IA a répondu dans un format inattendu. Renvoie, en une phrase plus simple si possible.",
      http:"Erreur côté Google (" + (e?.detail || "").slice(0, 80) + "). Réessaie dans un instant."
    }[e?.code] || "La réponse n’est pas arrivée. Réessaie.");
    if (mainsLibres && e?.code !== "key" && e?.code !== "rate") setTimeout(ecouterAuto, 1500);
  } finally {
    busy = false; mic.disabled = !started;
  }
}

function submit(text){
  const t = (text || "").trim();
  if (!t || busy || !started) return;
  stopSpeak(); unlockAudio();
  const you = el("div","you",t); feed.append(you); scrollDown();
  history.push({role:"user", content:t});
  ask(t, you);
}
/* ---------- Historique des conversations (sur le telephone, 20 max, 40 messages max chacune) ---------- */
/* ---------- Un seul fil de conversation ----------
   Practice reprend toujours la suite ; le fil est garde sur le telephone (derniers echanges pour le modele,
   journal complet pour l'affichage, borne a 400). Seuls les derniers echanges sont mis dans la page. */
const MSG_MAX = 40, JOURNAL_MAX = 400, PAGE_INIT = 12, PAGE_PLUS = 20;
function fil(){ if (!S.fil || typeof S.fil !== "object") S.fil = {msgs:[], journal:[], d:0}; return S.fil; }
function sauverConv(){
  const f = fil();
  f.msgs = history.slice(-MSG_MAX); f.journal = journal.slice(-JOURNAL_MAX); f.d = Date.now();
  if (theme && !theme.libre) f.theme = {fr:theme.fr, en:theme.en, role:theme.role};
  saveS();
}
function chargerFil(){
  const f = fil();
  history = (f.msgs || []).slice(-20); journal = (f.journal || []).slice(-JOURNAL_MAX);
}
function repartirAZero(){ S.fil = {msgs:[], journal:[], d:0}; history = []; journal = []; saveS(); }
let affiches = 0;   // nombre d'entrees du journal deja mises dans la page (en partant de la fin)
function rendreEntree(m){
  if (m.role === "user") {
    const y = el("div", "you passe" + (m.tried ? " attempt tried" : ""), m.content);
    if (m.tried) marquer(y, m.corrections || [], "faute");
    else if (m.ok && !m.forced) { y.classList.add("juste"); if (m.conseil?.better) marquer(y, [m.conseil], "mieux"); }
    return y;
  }
  const morceaux = Array.isArray(m.chunks) && m.chunks.length ? m.chunks : [{en:m.content, fr:m.fr || ""}];
  const t = renderClaude(morceaux, m.fr || "", true);
  t.play.classList.remove("ready");
  return t.wrap;
}
function afficherEchanges(n = PAGE_INIT){
  feed.querySelectorAll(".you.passe, .claude, .filtools").forEach(x => x.remove());
  affiches = Math.min(journal.length, n);
  const bloc = journal.slice(journal.length - affiches).map(rendreEntree);
  feed.append(...bloc);
  feed.querySelectorAll(".claude").forEach(c => c.classList.add("old", "passe"));
  if (journal.length) {
    // seul endroit ou l'on peut repartir a zero : en haut du fil, dans la conversation
    const tools = el("div", "filtools");
    const zero = el("button", "plushaut zero", "Repartir à zéro");
    zero.onclick = () => {
      if (busy || !confirm("Effacer toute la conversation et repartir à zéro ?")) return;
      repartirAZero(); feed.querySelectorAll(".you, .claude, .filtools, .tip, .skip").forEach(x => x.remove()); essai = null;
      if (theme?.libre) setTheme(S.theme?.fr ? S.theme : THEMES[0]);
      modeConversation(false); $("themeName").textContent = theme.fr; ask(null);
    };
    tools.append(zero); feed.prepend(tools);
  }
  majPlusHaut(); scrollDown();
}
function majPlusHaut(){
  feed.querySelector(".plushaut:not(.zero)")?.remove();
  if (affiches >= journal.length) return;
  const b = el("button", "plushaut", "Plus haut");
  b.onclick = () => {
    const avant = feed.scrollHeight;
    const nouveaux = journal.slice(Math.max(0, journal.length - affiches - PAGE_PLUS), journal.length - affiches).map(rendreEntree);
    nouveaux.forEach(x => { if (x.classList.contains("claude")) x.classList.add("old", "passe"); });
    feed.querySelector(".filtools").after(...nouveaux); affiches += nouveaux.length; majPlusHaut();
    feed.scrollTop += feed.scrollHeight - avant;
  };
  feed.querySelector(".filtools").prepend(b);
}

    const p = profil(), n = Math.min(10, Math.max(1, p.niveau || 4));
    const carte = el("div", "profcard");
    const head = el("div", "profhead"); head.append(el("b", null, "Niveau " + n), el("span", null, CEFR(n)));
    const bar = el("div", "profbar"); const i = el("i"); i.style.width = (n * 10) + "%"; bar.append(i);
    carte.append(head, bar);
    const stats = el("div", "profstats");
    const stat = (v, l) => { const d = el("div", "stat"); d.append(el("b", null, String(v)), el("span", null, l)); return d; };
    stats.append(stat(p.tours || 0, "échanges"), stat(p.acquis.length, "acquis"), stat(Object.keys(p.fautes).length, "à surveiller"));
    const pills = (liste, cls) => { const w = el("div", "pills"); liste.forEach(x => w.append(el("span", "pill " + cls, x))); return w; };
    if (!focus) choisirFocus();
    const blocs = [carte, stats];
    const l = lecon() || choisirLecon();
    blocs.push(el("div", "profsec", "Défi en cours"), pills([l.cible.fr + "  " + "●".repeat(l.points) + "○".repeat(3 - l.points)], ""));
    if ((p.lecons || []).length) blocs.push(el("div", "profsec", "Défis réussis"), pills(p.lecons.map(id => (CIBLES.find(c => c.id === id) || {fr: id.startsWith("s:") ? "utiliser le " + (NOM_STRUCT[id.slice(2)] || id.slice(2)) : id}).fr), "ok"));
    if (p.acquis.length) { blocs.push(el("div", "profsec", "Acquis"), pills(p.acquis.map(x => NOM_STRUCT[x] || x), "ok")); }
    const fautes = Object.entries(p.fautes).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k]) => k);
    if (fautes.length) { blocs.push(el("div", "profsec", "À surveiller"), pills(fautes, "ko")); }
    blocs.push(el("div", "profsec", "Réglages"));
    body.replaceChildren(...blocs,
      ligneReg("Historique", (() => { const n = Math.ceil((fil().journal?.length || 0) / 2); return n ? n + (n > 1 ? " échanges" : " échange") : "vide"; })(), () => setPage("historique")),
      ligneReg("Voix", voixLabel, () => setPage("voix")),
      ligneReg("Écoute", ecouteGemini() ? "Gemini" : "Dictée Chrome", () => setPage("ecoute")),
      ligneReg("Vitesse", vit, () => setPage("vitesse")),
      ligneReg("Clés", S.key ? (S.azKey ? "Gemini, Azure" : "Gemini") : "Gemini manquante", () => setPage("cles"), S.key ? "" : "alerte"),
      ligneReg("Mémoire", memo().length ? memo().length + (memo().length > 1 ? " faits" : " fait") : "vide", () => setPage("memo"))
    );
  } else if (pageReg === "voix") {
    titre.textContent = "Voix";
    const vue = provVue || prov;
    const seg = el("div", "seg");
    for (const k of ["az", "g", "sys"]) {
      const b = el("button", null, NOM_PROV[k] + (k === prov ? " •" : "")); b.setAttribute("role", "tab"); b.setAttribute("aria-checked", String(k === vue));
      b.onclick = () => { provVue = k; rendreReglages(); };
      seg.append(b);
    }
    const rows = VOIX[vue].map(([v, n, sub]) => ligneRadio(n, sub, v === S.voice, () => { S.voice = v; saveS(); rendreReglages(); }));
    const alertes = [];
    if (vue === "az" && !S.azKey) alertes.push(ligneReg("Clé Azure manquante", "", () => setPage("cles"), "alerte"));
    if (vue === "g" && !S.key) alertes.push(ligneReg("Clé Gemini manquante", "", () => setPage("cles"), "alerte"));
    const test = el("button", "ghostbtn full", "Tester la voix");
    test.onclick = async () => { unlockAudio(); test.textContent = "…"; await speak("Hi there! How are you getting on? Is this voice easy to understand?", null, null); test.textContent = derniereVoix ? "Testé : " + derniereVoix : "Tester la voix"; };
    body.replaceChildren(seg, ...alertes, ...rows, test);
  } else if (pageReg === "historique") {
    titre.textContent = "Historique";
    const j = (fil().journal || []);
    if (!j.length) { body.replaceChildren(el("p", "tip", "Rien pour l’instant.")); return; }
    const jour = t => { if (!t) return "Avant"; const d = new Date(t), now = new Date(); const diff = Math.floor((now.setHours(0,0,0,0) - new Date(d).setHours(0,0,0,0)) / 864e5); return diff === 0 ? "Aujourd’hui" : diff === 1 ? "Hier" : d.toLocaleDateString("fr-FR", {day:"numeric", month:"long"}); };
    const liste = el("div", "histo"); let dernierJour = null, pos = j.length;
    const rendre = (deb, fin) => {
      const frag = document.createDocumentFragment();
      for (let k = deb; k < fin; k++) {
        const m = j[k], dj = jour(m.t);
        if (dj !== dernierJour) { dernierJour = dj; frag.append(el("div", "profsec", dj)); }
        const li = el("div", "hline " + (m.role === "user" ? "moi" : "ia") + (m.tried ? " rate" : ""), m.content);
        frag.append(li);
      }
      return frag;
    };
    const plus = el("button", "plushaut", "Plus haut");
    const page = () => { const deb = Math.max(0, pos - 60); dernierJour = null; const frag = rendre(deb, pos); liste.prepend(frag); pos = deb; plus.hidden = pos === 0; };
    plus.onclick = page;
    body.replaceChildren(plus, liste); page();
  } else if (pageReg === "ecoute") {
    titre.textContent = "Écoute";
    const gem = ligneRadio("Gemini", ENREG_OK ? "entend ta vraie prononciation" : "indisponible dans ce navigateur", ecouteGemini(), () => { if (ENREG_OK) { S.ecoute = "gemini"; saveS(); rendreReglages(); } });
    const chr = ligneRadio("Dictée Chrome", SR ? "texte seulement, un peu plus rapide" : "indisponible dans ce navigateur", !ecouteGemini(), () => { if (SR) { S.ecoute = "chrome"; if (mainsLibres) mlStop("", true); saveS(); rendreReglages(); } });
    body.replaceChildren(gem, chr);
  } else if (pageReg === "vitesse") {
    titre.textContent = "Vitesse";
    body.replaceChildren(...VITESSES.map(([v, n]) => ligneRadio(n, "", Number(S.speed) === Number(v), () => { S.speed = Number(v); saveS(); rendreReglages(); })));
  } else if (pageReg === "cles") {
    titre.textContent = "Clés";
    const gem = champReg("Gemini", "keyIn", S.key, "password", "Clé API Gemini", v => { S.key = v; saveS(); });
    const lien = el("a", "reglink", "Obtenir une clé Gemini gratuite"); lien.href = "https://aistudio.google.com/apikey"; lien.target = "_blank"; lien.rel = "noopener";
    const az = champReg("Azure Speech", "azKeyIn", S.azKey || "", "password", "KEY 1 (facultatif, voix Azure)", v => { if (v !== (S.azKey || "")) { azureKO = false; audioCache.clear(); } S.azKey = v; saveS(); });
    const regW = el("div", "regfield"), rl = el("label", null, "Région Azure"), rs = el("select"); rl.htmlFor = "azRegionIn"; rs.id = "azRegionIn";
    for (const [v, n] of REGIONS) { const o = el("option", null, n); o.value = v; rs.append(o); }
    rs.value = S.azRegion || "swedencentral"; rs.onchange = () => { S.azRegion = rs.value; azureKO = false; audioCache.clear(); saveS(); };
    regW.append(rl, rs);
    const det = el("details", "avance"); det.append(el("summary", null, "Avancé"));
    det.append(champReg("Modèle Gemini", "modelIn", S.model, "text", DEFAULTS.model, v => { S.model = v || DEFAULTS.model; saveS(); }));
    body.replaceChildren(gem, lien, az, regW, det);
  } else if (pageReg === "memo") {
    titre.textContent = "Mémoire";
    const l = el("div"); l.id = "memoList";
    const clear = el("button", "skip", "Tout oublier"); clear.id = "memoClear";
    clear.onclick = () => { if (confirm("Oublier tout ce que l’appli sait de toi ?")) { S.memo = []; saveS(); afficherMemo(); } };
    body.replaceChildren(l, clear); afficherMemo();
  }
}
function setPage(pg){ pageReg = pg; provVue = null; rendreReglages(); $("settings").querySelector(".sheet").scrollTop = 0; }
function openSettings(){ pageReg = "main"; rendreReglages(); ouvrir("settings"); }
$("gear").onclick = openSettings;
$("setBack").onclick = () => setPage("main");
$("setClose").onclick = () => fermer("settings");
$("settings").onclick = e => { if (e.target.id === "settings") fermer("settings"); };

$("newTheme").onclick = allerAccueil;
majDepart();

if (!S.key) setStatus("Première fois ? Ajoute ta clé Gemini gratuite dans les réglages ⚙️.");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
