function etapeSuivante(){
  if (!seance) return;
  if (seance.phase === "rappel") { if (seance.etape < seance.rappels.length) { afficherEtape(); return; } seance.phase = "modele"; seance.etape = 0; }
  if (seance.phase === "modele") { afficherModele(); return; }
  if (seance.phase === "guide") { if (seance.etape < seance.guide.length) { afficherEtape(); return; } if (seance.enSecours) { seance.defiFait = true; seance.progres = seance.total; afficherBilan(); return; } seance.phase = "libre"; seance.etape = 0; majLeconChip(); quitterScene(); ask(null); return; }
  if (seance.phase === "libre") { afficherBilan(); }
}
// reponse a une carte jugee
function etapeReussie(d, learner){
  const e = etapeCourante(); enTransition = true; mic.disabled = true;
  seance.faits.push(learner);
  if (seance.phase === "rappel") { noterRappel(e.item, true); seance.rappelsOk++; stats().rOk++; }
  else { seance.progres++; majLeconChip(); }
  seance.etape++;
  ding().then(() => speak(d.reply_en && d.reply_en.length < 40 ? d.reply_en : "Perfect.", null, null)).then(() => pause(500)).then(() => etapeSuivante());
}
function etapeRatee(){
  const e = etapeCourante(); enTransition = true; mic.disabled = true;
  if (seance.phase === "rappel") noterRappel(e.item, false);
  else { seance.progres++; majLeconChip(); ajouterRappel({type:"defi", en:e.en}); }   // ratee : elle reviendra en rappel
  // on montre la phrase attendue, on la dit, et on passe a la suite
  const c = carte("attendu", [el("p", "ctexte", e.en)]);
  const b = el("button", "cplay"); b.innerHTML = PLAY; b.onclick = () => { unlockAudio(); speak(e.en, b, null); }; c.prepend(b);
  zone().append(c);
  seance.etape++;
  speak(e.en, b, null).then(() => pause(1400)).then(() => etapeSuivante());
}
let seancePrete = null;   // {id, prom} : la seance du prochain defi, preparee a l'avance
function prechargerSeance(){
  if (!S.key) return Promise.resolve();
  const l = lecon() || choisirLecon();
  if (seancePrete?.id === l.cible.id) return seancePrete.prom;
  const prom = preparerSeance(); seancePrete = {id:l.cible.id, prom};
  prom.catch(() => { if (seancePrete?.prom === prom) seancePrete = null; });
  return prom;
}
async function lancerSeance(){
  seance = {phase:"prep", etape:0, rappels:[], guide:[], modele:null, faits:[], rappelsOk:0, libreTours:0, essais:0, defiFait:false, progres:0, total:0};
  // la pastille suit la seance : carte du mot, chaque consigne, la partie libre ; finir = valider
  const ld = lecon() || choisirLecon(); seance.defiNom = ld.cible.fr; majLeconChip();
  const dots = el("div", "dots"); dots.append(el("i"), el("i"), el("i")); zone().append(dots);
  busy = true; mic.disabled = true;
  try {
    // la seance a souvent ete preparee pendant la validation a l'accueil
    const pret = seancePrete?.id === ld.cible.id ? seancePrete.prom : null; seancePrete = null;
    const prep = await (pret ? pret.catch(() => preparerSeance()) : preparerSeance());
    Object.assign(seance, prep); seance.phase = seance.rappels.length ? "rappel" : "modele";
    seance.total = 1 + seance.guide.length + 1;
    const st = stats(); st.rTot += seance.rappels.length; saveS();
  } catch (e) { console.warn("seance non preparee, conversation simple", e); seance = null; }
  dots.remove(); busy = false;
  majLeconChip();
  if (seance) etapeSuivante(); else ask(null);
}

/* Le coach : a chaque tour, l'appli impose un MOUVEMENT a l'IA, comme un bon coach de conversation.
   - jamais de question fermee ni de question qui appelle trois mots : on demande un recit, un avis a defendre,
     une explication, une hypothese, une comparaison (de quoi parler 3 ou 4 phrases) ;
   - jamais deux relances d'affilee sur le meme fil : au 3e tour on change d'angle ;
   - un tour sur trois environ, c'est a lui de poser les questions (amorce ou invitation), davantage s'il ne le fait pas. */
const MOUVEMENTS = {
  story:   "Ask him to TELL you about a concrete experience, in detail (\"Tell me about the last time...\", \"Walk me through...\", \"What happened when...\"): something that needs 3 or 4 sentences.",
  opinion: "Ask his real OPINION on something concrete linked to the topic, then (next turn) gently push back or play devil's advocate so he has to argue.",
  explain: "Ask him to EXPLAIN or teach you something he knows well (how it works, how he does it), step by step.",
  hypo:    "Ask a HYPOTHETICAL (\"What would you do if...\", \"Imagine you had to...\") that needs a developed answer.",
  compare: "Ask him to COMPARE two things (France and Ireland, before and now, two options) and say which he prefers and why.",
  switch:  "CHANGE THE ANGLE: do not ask anything more about what he just said. Move to a different aspect of the topic (or a neighbouring topic) with a fresh, open question that needs a developed answer.",
  hook:    "Do NOT end with a question. React, then end with an intriguing statement, a surprising fact or a strong opinion linked to the topic that leaves a curiosity gap, so that HE wants to ask you something.",
  invite:  "Do NOT ask him anything about himself. Share one interesting thing or opinion, then invite him to ask YOU questions about it (e.g. \"Ask me anything about that\").",
  mission: "Do not interview him. Answer only what he asked, briefly and clearly; reveal the next piece of information only when he asks for it. If he is stuck, give a small clue about what he could ask."
};
const OUVERTS = ["story", "opinion", "explain", "hypo", "compare"];
let mouvPrec = "", nbTours = 0;
function choisirFin(learner){
  if (theme.mission) return "mission";
  if (theme.inverse) return "invite";
  if (!learner) { mouvPrec = "story"; nbTours = 0; choisirFocus(); return focus && MOUV_STRUCTURE[focus.structure] || "story"; }
  nbTours++;
  const recents = history.filter(h => h.role === "user").slice(-4, -1);
  const posees = recents.filter(h => h.asked).length;
  const passif = recents.length >= 2 && posees / recents.length < 0.5;
  let m;
  if (passif && nbTours % 2 === 0) m = mouvPrec === "invite" ? "hook" : "invite";      // il ne pose jamais de question : on lui tend la perche
  else if (nbTours % 3 === 0) m = Math.random() < 0.5 ? "switch" : "hook";              // on ne tourne pas en rond
  else {
    const pool = OUVERTS.filter(x => x !== mouvPrec);
    const prefere = focus && MOUV_STRUCTURE[focus.structure];
    m = (prefere && prefere !== mouvPrec && Math.random() < 0.6) ? prefere : pool[Math.floor(Math.random() * pool.length)];
  }
  mouvPrec = m; return m;
}
const FINS = MOUVEMENTS;
function buildPrompt(learner, essai, audio){

  const seanceCtx = contexteSeance(learner);
  const transcript = (seanceCtx?.cible ? "" : history.map(h => (h.role === "user" ? "Learner: " : "You: ") + h.content).join("\n")) || "(nothing yet)";
  // en nouvelle session, les anciens echanges servent de contexte : on les marque comme tels
  const ancien = !learner && history.length ? "(earlier session)\n" : "";
  const retry = essai ? `
The learner is RETRYING their answer to your last line. Their previous attempt was: """${essai.prev}"""
and you corrected: ${essai.corrections.map(c => `"${c.original}" -> "${c.corrected}"`).join("; ")}.
Judge the new attempt on its own: it may be worded differently, that is fine. If the mistakes above are now fixed and there is no NEW clear grammar mistake, ok MUST be true: do not nitpick style, word choice or relevance on a retry.` : "";
  const force = essai?.force ? `
The learner chose to move on: set ok to true, corrections to [], and reply normally.` : "";
  return `You are an AI English conversation partner, chatting with a French-speaking engineering student who wants to speak fluently (intermediate level). Be warm, curious and natural, like a friendly person would, but never pretend to be human or invent a personal life (no name, job, weekend or memories of your own): you can share opinions, ideas and knowledge. Your own English must be flawless: you are his model.
NEVER invent facts about the learner and NEVER put him in a fictional situation or give him a role: talk about his REAL life, and when you do not know something, ASK.
${theme.libre ? "Today's topic: whatever he wants. Follow his topic, react to it and ask good follow-up questions." : `Today's topic: ${theme.en}. ${theme.role} Follow him if he goes elsewhere.`}

STEP 1, CHECK the learner's message. ${seanceCtx?.cible ? "GUIDED EXERCISE: " + seanceCtx.cible + " Here, a word that does not say what the French instruction asks IS a mistake (example: the instruction says « le soir » and he says \"afternoon\": correction \"afternoon\" -> \"evening\", type \"vocabulaire\", vocab fr « le soir », en \"evening\", ok false).\n" : ""}${audio ? `His message is the attached AUDIO recording. It is a BRAND-NEW recording: it is never one of the lines written above. Transcribe only the sounds in it; if what you think you hear is identical to an earlier line, you are guessing: write "".
- "heard": write exactly what he said, word for word, KEEPING his grammar mistakes (never fix them here). If the audio is silent, too quiet or not intelligible, write "" and set ok to true with empty fields: NEVER guess, and NEVER reuse a sentence from the conversation above. "clair": true only if EVERY word was clearly intelligible; if you had to guess even one word, set "clair" to false and "heard" to "" (he will simply say it again).
- For EACH correction, "debut" and "fin" = where the corrected words are spoken in the audio, in seconds from the start of the recording (decimals allowed, e.g. 1.4 and 2.1). Be as precise as you can.
- You can HEAR his pronunciation: if a word is clearly mispronounced, so that a native speaker could misunderstand it, add a correction: "original" = the word, "corrected" = the same word, explanation in French starting with "Prononciation :" saying how to say it (e.g. "Prononciation : le « th » se fait langue entre les dents"). Never correct the French accent itself, only real mispronunciations. At most one pronunciation correction.` : `It is transcribed from SPEECH: ignore spelling, punctuation and capital letters. "heard": "".`} Look only for real mistakes a native speaker would notice: grammar, wrong word, missing word, wrong tense, word order, a French-style phrase that sounds wrong in English. If a word looks wrongly transcribed in a way that suggests a pronunciation problem, add a correction whose explanation starts with "Prononciation ?". Do not correct things that are merely less elegant.
- Corrections are ONLY about his English (grammar, words, phrasing, pronunciation), never about the content. A question to you, even about something you cannot do or do not have as an AI, is never a mistake: answer it in STEP 2. Example: "what did you do last weekend" is PERFECT English, so ok = true and corrections = []; then in your reply, explain kindly that as an AI you do not have weekends. Never change his question into another question.
- QUESTIONS deserve special care, they are where French speakers slip: missing do/does/did ("Where you go?"), wrong word order ("Where you are going?"), indirect questions ("Can you tell me where is the station?" -> "where the station is"), missing auxiliary. These ARE mistakes.
- "learner_asked": true if his message contains a real question to you (even a short one), false otherwise.

- "corrections": ALL his mistakes (up to 5), never just the first one: wrong word (vocabulary), missing word, wrong tense, preposition, word order, and the challenge target; each with the exact wrong words, the corrected words, a French explanation of 12 words max, addressing the learner with « tu » (never « vous »), "debut"/"fin" (0 and 0 when there is no audio), and "type" = the category in 2 or 3 French words, reused consistently (e.g. "prétérit oublié", "question sans do", "article", "préposition", "pluriel", "ordre des mots", "accord sujet-verbe", "vocabulaire", "prononciation"); use EXACTLY "cible" when the mistake is about today's challenge target (missing or wrong), and EXACTLY "prononciation" for pronunciation. Empty if ok.
- "fixed_en": his WHOLE sentence corrected, natural, same meaning and same length (this is what he will say again). "" if ok.
- "vocab": ONLY if one correction is a vocabulary gap (he used a wrong, French-sounding or missing word for a concept he meant, e.g. "afternoon" for « le soir »): "fr" = the French concept, "en" = the right English word, "lies" = 3 related words of the same family (e.g. morning / afternoon / night), each {fr, en}. Otherwise fr "", en "", lies [].
- "obs" (about his message, even when ok): "structures" = the grammar structures he used CORRECTLY, only from this list: ${STRUCTURES.join(", ")} (empty if none); "verbs" = the main verbs he used, base form, 6 max; "level" = the level of this message from 1 (A1) to 10 (C2). For an empty or inaudible message: [], [], 0.
${retry}${force}

STEP 2, only if ok is true, REPLY. If ok is false, leave reply_en, reply_fr, hint_en and hint_fr empty and chunks [].
- "reply_en": your whole reply, READ ALOUD. HARD LIMIT: 1 or 2 short sentences, 25 words in total, never more (he learns by speaking, not by listening to you). ${seanceCtx ? seanceCtx.reponse : `React in a few words to what he said (show you listened), answer if he asked something, then make this move in ONE short sentence: ${FINS[fin]}
  COACH RULES: never a yes/no question; never a detail about a detail; never repeat a question already asked; vary the angles. Ask for ONE thing at a time, never "tell me everything".`}
- "chunks": reply_en cut into consecutive pieces of 1 to 4 words, in order; joined with spaces they must give reply_en exactly. Keep idioms, phrasal verbs and set expressions in one piece. Punctuation stays attached to its piece.
  "fr" = the French meaning of THAT piece only (never of the next or previous piece). Example: {"en":"Are you looking","fr":"Tu cherches"},{"en":"for a pub?","fr":"un pub ?"}

- "cible": ${seanceCtx ? seanceCtx.cible : `today's challenge target is ${JSON.stringify((lecon() || choisirLecon()).cible.en)}. "ok" if this message contains a correct use of it (any form), "ko" if he tried to use it but got it wrong (then it is also a correction), "non" if he did not use it.`}
- "command": "pause" ONLY if his whole message is a request to pause or stop the conversation (in English or French: "pause", "stop", "on arrête", "let's stop here", "I need a break"); then also set ok to true and corrections to []. Otherwise "".

${profilTexte()}

What you already know about the learner from earlier conversations:
${memoTexte()}
Use a fact ONLY when today's topic is directly about it (e.g. his studies when the topic is his studies). Do not mention unrelated facts, not even in a greeting. Never list them, never mention that you have notes.

Conversation so far:
${ancien}${transcript}

${seanceCtx && !learner ? seanceCtx.ouverture : ""}${audio ? "The learner's answer is in the attached audio." : learner ? `The learner just said: """${learner}"""` : seanceCtx ? "" : "There is no learner message yet: set ok to true, corrections to []. " + (history.length ? "This is a NEW SESSION of an ongoing relationship: welcome him back in a few warm words (no recap of what was said before), then announce today's challenge in one or two short sentences: " + (lecon()?.points ? "we keep working on it, he needs " + (3 - lecon().points) + " more good uses" : "a NEW challenge, with one short example of the target") + ", then open today's topic with a question that naturally calls for the target" : "Start the conversation: greet him warmly in one short sentence, announce today's challenge with one short example of the target, and open today's topic with a question that naturally calls for it") + " (with an open question that invites him to tell something, not a yes/no question; or, if he is the one asking the questions, invite him to ask you anything; or, for a mission, state the mission clearly). Stick to today's topic; use a known fact only if it fits it."}`;
}

// Les fautes sont marquees directement dans la bulle de l'apprenant (rouge souligne) ; un toucher
// ouvre la correction. Une tournure juste mais seche est soulignee en vert pointille (conseil).
// Si les mots exacts ne sont pas retrouves (l'IA a reformule), toute la bulle porte la marque.
function marquer(youEl, items, cls){
  const texte = youEl.textContent, low = texte.toLowerCase();
  const zones = [];
  for (const it of items) {
    const o = String(it.original || "").trim().toLowerCase().replace(/[.?!,]+$/, "");
    if (!o) continue;
    let i = low.indexOf(o);
    while (i >= 0 && zones.some(z => i < z.fin && i + o.length > z.deb)) i = low.indexOf(o, i + 1);
    if (i >= 0) zones.push({deb:i, fin:i + o.length, items:[it]});
  }
  youEl.replaceChildren();
  const span = (txt, its) => { const sp = el("span", cls + (its[0]?.type === "cible" ? " cible" : ""), txt); sp.tabIndex = 0; sp.onclick = e => { e.stopPropagation(); showFixPop(sp, its); }; sp.onkeydown = e => { if (e.key === "Enter") showFixPop(sp, its); }; return sp; };
  if (!zones.length) { youEl.append(span(texte, items)); return; }
  zones.sort((x, y) => x.deb - y.deb);
  let pos = 0;
  for (const z of zones) {
    if (z.deb > pos) youEl.append(document.createTextNode(texte.slice(pos, z.deb)));
    youEl.append(span(texte.slice(z.deb, z.fin), z.items)); pos = z.fin;
  }
  if (pos < texte.length) youEl.append(document.createTextNode(texte.slice(pos)));
}
// Rejoue un passage de l'enregistrement (avec une petite marge) ; tout l'enregistrement si la position manque.
const decodes = new WeakMap();
async function jouerPassage(blob, debut, fin){
  unlockAudio();
  let buf = decodes.get(blob);
  if (!buf) { buf = await actx.decodeAudioData(await blob.arrayBuffer()); decodes.set(blob, buf); }
  let d0 = 0, d1 = buf.duration;
  if (fin > debut && fin > 0 && debut < buf.duration) { d0 = Math.max(0, debut - 0.25); d1 = Math.min(buf.duration, fin + 0.3); }
  try { currentSrc?.stop(); } catch {}
  const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
  src.onended = () => { if (currentSrc === src) currentSrc = null; };
  currentSrc = src; src.start(0, d0, Math.max(0.35, d1 - d0));
}
function showFixPop(sp, items){
  hidePop(); selChunk = sp; sp.classList.add("sel");
  const box = el("div", "popfix");
  for (const c of items) {
    const row = el("div", "poprow"), t = el("div", "poptxt");
    t.append(el("b", null, c.corrected || c.better || ""));
    const why = c.explanation_fr || c.why_fr; if (why) t.append(el("small", null, why));
    const pl = el("button", "popplay"); pl.innerHTML = PLAY; pl.setAttribute("aria-label", "Écouter la bonne prononciation");
    pl.onclick = e => { e.stopPropagation(); unlockAudio(); speak(c.corrected || c.better, pl, null); };
    const blob = sp.closest(".you")?._rec;
    if (blob) {
      const moi = el("button", "popplay moi"); moi.innerHTML = ICO_MIC; moi.setAttribute("aria-label", "Réécouter ce que j’ai dit");
      moi.onclick = e => { e.stopPropagation(); stopSpeak(); jouerPassage(blob, c.debut, c.fin).catch(() => {}); };
      row.append(t, moi, pl);
    } else row.append(t, pl);
    box.append(row);
  }
  pop.classList.add("fixpop"); pop.replaceChildren(box); placerPop(sp);
}
function renderFix(d, youEl, onSkip){
  feed.querySelectorAll(".skip, .recast").forEach(b => b.remove());
  const list = Array.isArray(d.corrections) ? d.corrections.filter(c => c && c.corrected) : [];
  if (d.ok) {
    youEl.classList.add("juste");
    if (d.pron?.length) marquer(youEl, d.pron, "pron");
    const c = d.conseil;
    const enExo = seance && (seance.phase === "rappel" || seance.phase === "guide");
    const re = lecon()?.cible?.re;
    const retireCible = re instanceof RegExp && re.test(String(c?.original || "")) && !re.test(String(c?.better || ""));
    if (!enExo && !retireCible && c && c.better && c.better.trim() && journal.length - dernierConseil >= 6) { dernierConseil = journal.length; marquer(youEl, [c], "mieux"); }
    return youEl;
  }
  marquer(youEl, list, "faute");
  const skip = el("button", "skip", "Passer");
  skip.onclick = () => { skip.remove(); onSkip(); };
  youEl.after(skip);
  // la phrase entiere corrigee, a redire ; un toucher la fait entendre
  if (d.fixed_en && normPhrase(d.fixed_en) !== normPhrase(youEl.textContent)) {
    const rc = el("button", "recast"); rc.append(el("span", null, d.fixed_en)); const ic = el("span", "rcplay"); ic.innerHTML = PLAY; rc.append(ic);
    rc.onclick = () => { unlockAudio(); speak(d.fixed_en, rc, null); };
    youEl.after(rc);
  }
  return youEl;
}

// Remet le flou (et cache la traduction) sur toutes les repliques affichees : on ecoute, on ne lit pas.
function reflouter(){
  feed.querySelectorAll(".claude").forEach(c => {
    c.querySelector(".msg")?.classList.add("hide"); c.classList.remove("trad");
    const libs = c.querySelectorAll(".tbtn span"); if (libs[0]) libs[0].textContent = "Afficher"; if (libs[1]) libs[1].textContent = "Traduire";
  });
  hidePop();
}
function renderClaude(chunks, replyFr, passe){
  if (!passe) {
    reflouter();
    feed.querySelectorAll(".claude").forEach(c => c.classList.add("old"));
    feed.querySelectorAll(".play.ready, .skip").forEach(b => b.classList.contains("skip") ? b.remove() : b.classList.remove("ready"));
  }
  const wrap = el("div","claude");
  const msg = el("p","msg hide");
  chunks.forEach((c, i) => {
    const s = el("span","chunk",c.en); s.tabIndex = 0;
    s.onclick = e => { e.stopPropagation(); showPop(s, c.en, c.fr); };
    s.onkeydown = e => { if (e.key === "Enter") showPop(s, c.en, c.fr); };
    msg.append(s); if (i < chunks.length - 1) msg.append(" ");
  });
  const text = chunks.map(c => c.en).join(" ");
  const ctrl = el("div","ctrl");
  const play = el("button","play ready"); setPlay(play, false);
  play.addEventListener("click", () => play.classList.remove("ready"), {once:true});
  const eye = el("button","tbtn"); eye.innerHTML = EYE; const eyeL = el("span",null,"Afficher"); eye.append(eyeL);
  const tr = el("button","tbtn"); tr.innerHTML = TRANS; const trL = el("span",null,"Traduire"); tr.append(trL);
  const fr = el("p","fr",replyFr || "");
  const reveal = (on = true) => { msg.classList.toggle("hide", !on); eyeL.textContent = on ? "Masquer" : "Afficher"; };
  play.onclick = () => { if (speakingBtn === play) stopSpeak(); else speak(text, play, reveal); };
  eye.onclick = () => { hidePop(); reveal(msg.classList.contains("hide")); };
  tr.onclick = () => { hidePop(); const on = !wrap.classList.contains("trad"); wrap.classList.toggle("trad", on); trL.textContent = on ? "Anglais" : "Traduire"; if (on) reveal(true); };
  ctrl.append(play, eye); if (replyFr) ctrl.append(tr);
  wrap.append(msg, fr, ctrl); if (!passe) feed.append(wrap);
  return {text, play, reveal, wrap};
}

// Phrases dites a voix haute quand il faut recommencer (courtes, en cache apres le 1er usage).
const RETRY_LINES = ["Not quite. Have another go!", "Almost! Try that again.", "Close! Fix those bits and say it again.", "Nearly there. One more time!"];
let essai = null;         // tentative en cours de correction : {prev, corrections, youEl, first}
let serie = 0;            // reponses justes du premier coup, d'affilee
let nbQuestions = 0;
function majCompteur(){}   // le compteur n'est plus affiche (la serie sert encore a la logique)
function setSerie(n){ const monte = n > serie; serie = n; majCompteur(monte); }
function compterQuestion(){ nbQuestions++; majCompteur(true); }

// l'IA a "entendu" mot pour mot une phrase deja dite avant : c'est une invention sur un audio trop bas
function dejaDit(h){ const n = normPhrase(h); return n.split(" ").length >= 3 && history.filter(x => x.role === "user").slice(-8).some(x => normPhrase(x.content) === n); }
async function ask(learner, youEl, opts = {}){
  if (busy) return;
  busy = true; mic.disabled = true; hidePop();

/* ---------- Un seul fil de conversation ----------
   Practice reprend toujours la suite ; le fil est garde sur le telephone (derniers echanges pour le modele,
   journal complet pour l'affichage, borne a 400). Seuls les derniers echanges sont mis dans la page. */
const MSG_MAX = 40, CONTEXTE_JOURS = 3;
function fil(){ if (!S.fil || typeof S.fil !== "object") S.fil = {msgs:[], d:0}; return S.fil; }
function sauverConv(){
  const f = fil();
  f.msgs = history.slice(-MSG_MAX).map(h => h.t ? h : {...h, t:Date.now()}); delete f.journal; f.d = Date.now();
  if (theme && !theme.libre) f.theme = {fr:theme.fr, en:theme.en, role:theme.role};
  saveS();
}
function chargerFil(){
  const f = fil();
  // le passe s'efface tout seul : au-dela de quelques jours, le modele repart sans contexte
  const limite = Date.now() - CONTEXTE_JOURS * 864e5;
  history = (f.msgs || []).filter(h => !h.t || h.t > limite).slice(-20); journal = [];
}

    if (vue === "g" && !S.key) alertes.push(ligneReg("Clé Gemini manquante", "", () => setPage("cles"), "alerte"));
    const test = el("button", "ghostbtn full", "Tester la voix");
    test.onclick = async () => { unlockAudio(); test.textContent = "…"; await speak("Hi there! How are you getting on? Is this voice easy to understand?", null, null); test.textContent = derniereVoix ? "Testé : " + derniereVoix : "Tester la voix"; };
    body.replaceChildren(seg, ...alertes, ...rows, test);
  } else if (pageReg === "ecoute") {
    titre.textContent = "Écoute";
    const gem = ligneRadio("Gemini", ENREG_OK ? "entend ta vraie prononciation" : "indisponible dans ce navigateur", ecouteGemini(), () => { if (ENREG_OK) { S.ecoute = "gemini"; saveS(); rendreReglages(); } });
    const chr = ligneRadio("Dictée Chrome", SR ? "texte seulement, un peu plus rapide" : "indisponible dans ce navigateur", !ecouteGemini(), () => { if (SR) { S.ecoute = "chrome"; if (mainsLibres) mlStop("", true); saveS(); rendreReglages(); } });
    body.replaceChildren(gem, chr);
  } else if (pageReg === "vitesse") {
    titre.textContent = "Vitesse";
    body.replaceChildren(...VITESSES.map(([v, n]) => ligneRadio(n, "", Number(S.speed) === Number(v), () => { S.speed = Number(v); saveS(); rendreReglages(); })));
  } else if (pageReg === "cles") {
    titre.textContent = "Clés";
    const gem = champReg("Gemini", "keyIn", S.key, "password", "Clé API Gemini", v => { S.key = v; saveS(); });
    const lien = el("a", "reglink", "Obtenir une clé Gemini gratuite"); lien.href = "https://aistudio.google.com/apikey"; lien.target = "_blank"; lien.rel = "noopener";
    const az = champReg("Azure Speech", "azKeyIn", S.azKey || "", "password", "KEY 1 (facultatif, voix Azure)", v => { if (v !== (S.azKey || "")) { azureKO = false; audioCache.clear(); } S.azKey = v; saveS(); });
    const regW = el("div", "regfield"), rl = el("label", null, "Région Azure"), rs = el("select"); rl.htmlFor = "azRegionIn"; rs.id = "azRegionIn";
    for (const [v, n] of REGIONS) { const o = el("option", null, n); o.value = v; rs.append(o); }
    rs.value = S.azRegion || "swedencentral"; rs.onchange = () => { S.azRegion = rs.value; azureKO = false; audioCache.clear(); saveS(); };
    regW.append(rl, rs);
    const det = el("details", "avance"); det.append(el("summary", null, "Avancé"));
    det.append(champReg("Modèle Gemini", "modelIn", S.model, "text", DEFAULTS.model, v => { S.model = v || DEFAULTS.model; saveS(); }));
    body.replaceChildren(gem, lien, az, regW, det);
  } else if (pageReg === "memo") {
    titre.textContent = "Mémoire";
    const l = el("div"); l.id = "memoList";
    const clear = el("button", "skip", "Tout oublier"); clear.id = "memoClear";
    clear.onclick = () => { if (confirm("Oublier tout ce que l’appli sait de toi ?")) { S.memo = []; saveS(); afficherMemo(); } };
    body.replaceChildren(l, clear); afficherMemo();
  }
}
function setPage(pg){ pageReg = pg; provVue = null; rendreReglages(); $("settings").querySelector(".sheet").scrollTop = 0; }
function openSettings(){ pageReg = "main"; rendreReglages(); ouvrir("settings"); }
$("gear").onclick = openSettings;
const SOUS_REGLAGES = ["voix", "ecoute", "vitesse", "cles", "memo"];
$("setBack").onclick = () => setPage(SOUS_REGLAGES.includes(pageReg) ? "reglages" : "main");
$("setClose").onclick = () => fermer("settings");
$("settings").onclick = e => { if (e.target.id === "settings") fermer("settings"); };

$("newTheme").onclick = allerAccueil;
majDepart();

if (!S.key) setStatus("Première fois ? Ajoute ta clé Gemini gratuite dans les réglages ⚙️.");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// portrait seulement (effectif une fois l'appli installee ; le manifest le demande aussi)
try { screen.orientation?.lock?.("portrait").catch(() => {}); } catch {}
</script>
